<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#0e3b38">
		<title>Jaden – Contact</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main class="card">
			<header class="card__side">
				<img class="card__photo" src="profile.png" alt="Profile picture">
			</header>
			<section class="card__body">
				<h1 class="card__name" id="name">Jaden Rucerito</h1>
				<p class="card__title" id="title">Software Developer,<br>
					Aspiring Engineer</p>
				<dl class="card__details">
					<div class="card__row">
						<dt>Age</dt>
						<dd>21</dd>
					</div>
					<div class="card__row">
						<dt>Phone</dt>
						<dd><a id="phone" href="tel:+15615523166">+1(561)552-3166</a></dd>
					</div>
					<div class="card__row">
						<dt>Email</dt>
						<dd><a id="email" href="mailto:j.rucerito@gmail.com">j.rucerito@gmail.com</a></dd>
					</div>
					<div class="card__row">
						<dt>City</dt>
						<dd id="city">Boca Raton, FL</dd>
					</div>
				</dl>
				<div class="card__actions">
					<a class="btn btn--secondary" href="Resume_Jaden_Rucerito.pdf" target="_blank" rel="noopener">View resume</a>
					<a class="btn btn--primary" href="Jaden_Rucerito.vcf" download>Save contact</a>
				</div>
			</section>
		</main>
	</body>
</html>
